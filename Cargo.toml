[workspace]
members = ["crates/core", "crates/cli", "app/src-tauri"]
resolver = "3"
default-members = ["crates/core", "crates/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
monazip-core = { path = "crates/core" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tempfile = "3"
